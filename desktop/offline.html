<!doctype html>
<html><head><meta charset="utf-8"><title>Cadence</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px -apple-system, "Segoe UI", system-ui, sans-serif; background: #1c1c1e; color: #f5f5f7; }
  .card { text-align: center; max-width: 360px; }
  button { margin-top: 16px; padding: 9px 18px; border: 0; border-radius: 10px; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, #ff8c5c, #e2558c 45%, #6b4ddb); }
  p { color: #a1a1a6; }
</style></head>
<body><div class="card">
  <h2>Can't reach Cadence</h2>
  <p>Check your internet connection. Cadence will try again automatically.</p>
  <button id="retry">Try again</button>
</div>
<script>
  const target = new URLSearchParams(location.search).get('retry') || 'https://cadenceplanner.vercel.app/app';
  const go = () => { location.href = target; };
  document.getElementById('retry').onclick = go;
  addEventListener('online', go);
  setTimeout(go, 15000);
</script></body></html>
